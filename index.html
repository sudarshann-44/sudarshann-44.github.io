<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudarshan Sawandkar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="assets/face.jpg" />
  <style>
    /* ---------- Theme tokens ---------- */
    :root,
    :root[data-theme="dark"] {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #71717a;
      --bio: #d4d4d8;
      --line: #27272a;
      --accent: #818cf8;
      --icon: #ffffff;
      --icon-hover: #bfe0ff;
      --toggle-bg: rgba(255, 255, 255, 0.05);
      --toggle-border: #3f3f46;
      --toggle-hover-bg: rgba(129, 140, 248, 0.14);
      --ring: #AEEED3;
      --ring-glow: rgba(174, 238, 211, 0.6);
      --ring-edge: rgba(0, 0, 0, 0);
      --cat: #d4d4d8;
      color-scheme: dark;
    }

    :root[data-theme="light"] {
      --bg: #f8fafc;
      --fg: #0f172a;
      --muted: #64748b;
      --bio: #334155;
      --line: #e2e8f0;
      --accent: #2563eb;
      --icon: #0f172a;
      --icon-hover: #2563eb;
      --toggle-bg: rgba(15, 23, 42, 0.04);
      --toggle-border: #cbd5e1;
      --toggle-hover-bg: rgba(37, 99, 235, 0.1);
      --ring: #AEEED3;
      --ring-glow: rgba(40, 150, 105, 0.45);
      --ring-edge: rgba(20, 110, 80, 0.6);
      --cat: #1e293b;
      color-scheme: light;
    }

    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;
      font-weight: normal;
      font-style: normal;
      color: var(--fg);
      overflow: hidden;
      transition: background-color .35s ease, color .35s ease;
    }

    #root {
      position: relative;
      height: 100%;
      width: 100%;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ---------- Rhombus cursor (AEEED3) (mouse devices only) ---------- */
    .cursor-ring {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s ease;
      will-change: transform;
    }

    .cursor-ring.visible {
      opacity: 1;
    }

    .ring-inner {
      display: block;
      width: 36px;
      height: 36px;
      margin: -18px 0 0 -18px;
      overflow: visible;
      filter: drop-shadow(0 0 5px var(--ring-glow));
      transition: transform .18s ease;
    }

    .cursor-ring.hot .ring-inner {
      transform: scale(1.45);
    }

    .cursor-ring.down .ring-inner {
      transform: scale(0.72);
    }

    @media (hover: none), (pointer: coarse) {
      .cursor-ring { display: none; }
    }

    /* ---------- Cat walking on the spot (bottom right) ---------- */
    .cat {
      position: fixed;
      right: 28px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      width: 64px;
      height: 41px;
      z-index: 3;
      pointer-events: none;
      color: var(--cat);
    }

    .cat svg {
      display: block;
      overflow: visible;
    }

    .cat .leg {
      animation: step .7s ease-in-out infinite;
    }

    @keyframes step {
      0%, 100% { transform: rotate(-22deg); }
      50%      { transform: rotate(22deg); }
    }

    .cat .cat-body {
      animation: bob .35s ease-in-out infinite alternate;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to   { transform: translateY(-1.3px); }
    }

    .cat .tail {
      animation: sway 1.6s ease-in-out infinite alternate;
    }

    @keyframes sway {
      from { transform: rotate(-8deg); }
      to   { transform: rotate(8deg); }
    }

    .cat .eye {
      animation: eyeblink 5s ease-in-out infinite;
    }

    @keyframes eyeblink {
      0%, 93%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.1); }
    }

    @media (max-width: 600px) {
      .cat { right: 16px; }
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      margin: 0 0 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
      transition: color .35s ease;
    }

    /* typewriter caret: sits on the text baseline, net-zero width so nothing shifts */
    .caret {
      display: inline-block;
      width: 3px;
      height: 0.72em;
      margin-left: 2px;
      margin-right: -5px;
      vertical-align: baseline;
      border-radius: 2px;
      background: var(--accent);
      animation: blink 0.9s steps(1) infinite;
    }

    .caret.hidden {
      visibility: hidden;
      animation: none;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    p.bio,
    i.bio {
      max-width: 520px;
      color: var(--bio);
      line-height: 1.6;
      font-size: 16px;
      margin: 0 0 28px;
      transition: color .35s ease;
    }

    .links {
      display: flex;
      gap: 18px;
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      color: var(--icon);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      transition: color .15s, border-color .15s, transform .15s;
    }

    .links a:hover {
      color: var(--icon-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .foot {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
      transition: color .35s ease;
    }

    /* ---------- Theme toggle (top right) ---------- */
    .theme-toggle {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 16px;
      z-index: 5;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--toggle-border);
      background: var(--toggle-bg);
      color: var(--fg);
      cursor: pointer;
      padding: 0;
      transition: background .2s, border-color .2s, color .2s, transform .2s;
    }

    .theme-toggle:hover {
      background: var(--toggle-hover-bg);
      border-color: var(--accent);
      color: var(--icon-hover);
      transform: translateY(-1px);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .theme-toggle svg {
      animation: spin-in .4s ease;
    }

    @keyframes spin-in {
      from { transform: rotate(-90deg) scale(.6); opacity: 0; }
      to { transform: rotate(0) scale(1); opacity: 1; }
    }

    @media (max-width:480px) {
      .foot {
        flex-direction: column;
        gap: 4px;
        align-items: center;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .caret { animation: none; }
      .theme-toggle svg { animation: none; }
      .cat .leg, .cat .cat-body, .cat .tail, .cat .eye { animation: none; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    const { useEffect, useRef, useState, createElement: h } = React;

    const NAME = 'Sudarshan Sawandkar';
    const TYPE_DELAY = 350;   // ms before typing starts
    const TYPE_SPEED = 85;    // ms per character

    /* Canvas palettes for each theme */
    const PALETTES = {
      dark: {
        particle: 'rgba(212,212,216,0.85)',
        line: (a) => `rgba(161,161,170,${a * 0.28})`,
        lit: (s) => `rgba(${210 - 40 * s},${232 - 10 * s},255,${s})`,
        halo: (g) => `rgba(150,205,255,${g * 0.4})`,
        core: (g) => `rgba(255,255,255,${0.85 + g * 0.15})`,
        cometTail: (a) => `rgba(150,205,255,${a})`,
        cometGlow: 'rgba(170,215,255,0.35)',
        cometHead: 'rgba(255,255,255,1)'
      },
      light: {
        particle: 'rgba(51,65,85,0.75)',
        line: (a) => `rgba(71,85,105,${a * 0.35})`,
        lit: (s) => `rgba(${59 - 22 * s},${130 - 31 * s},246,${s})`,
        halo: (g) => `rgba(59,130,246,${g * 0.35})`,
        core: (g) => `rgba(29,78,216,${0.85 + g * 0.15})`,
        cometTail: (a) => `rgba(37,99,235,${a})`,
        cometGlow: 'rgba(59,130,246,0.3)',
        cometHead: 'rgba(30,64,175,1)'
      }
    };

    function getInitialTheme() {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') return saved;
      } catch (e) { /* storage unavailable */ }
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
        ? 'light' : 'dark';
    }

    function ThemeIcon({ theme }) {
      // dark mode shows a sun (click -> light); light mode shows a moon (click -> dark)
      if (theme === 'dark') {
        return h('svg', { viewBox: '0 0 24 24', width: 22, height: 22, fill: 'none', shapeRendering: 'geometricPrecision' },
          h('circle', { cx: 12, cy: 12, r: 4.2, stroke: 'currentColor', strokeWidth: 1.9 }),
          h('path', {
            d: 'M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6',
            stroke: 'currentColor', strokeWidth: 1.9, strokeLinecap: 'round'
          })
        );
      }
      return h('svg', { viewBox: '0 0 24 24', width: 22, height: 22, fill: 'none', shapeRendering: 'geometricPrecision' },
        h('path', {
          d: 'M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z',
          stroke: 'currentColor', strokeWidth: 1.9, strokeLinecap: 'round', strokeLinejoin: 'round'
        })
      );
    }

    function CursorRing() {
      const ref = useRef(null);

      useEffect(() => {
        const el = ref.current;
        let tx = -100, ty = -100, x = -100, y = -100, seen = false, raf;

        function onMove(e) {
          tx = e.clientX; ty = e.clientY;
          if (!seen) { x = tx; y = ty; seen = true; el.classList.add('visible'); }
          el.classList.toggle('hot', !!(e.target.closest && e.target.closest('a, button')));
        }
        function onLeave() { el.classList.remove('visible'); seen = false; }
        function onDown() { el.classList.add('down'); }
        function onUp() { el.classList.remove('down'); }
        function loop() {
          x += (tx - x) * 0.35; y += (ty - y) * 0.35;
          el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
          raf = requestAnimationFrame(loop);
        }
        raf = requestAnimationFrame(loop);

        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseleave', onLeave);
        document.addEventListener('mousedown', onDown);
        document.addEventListener('mouseup', onUp);
        return () => {
          cancelAnimationFrame(raf);
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseleave', onLeave);
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('mouseup', onUp);
        };
      }, []);

      return h('div', { className: 'cursor-ring', ref: ref, 'aria-hidden': 'true' },
        h('svg', { className: 'ring-inner', viewBox: '0 0 36 36' },
          // thin edge underneath keeps the pale mint visible on the light theme
          h('polygon', { points: '18,2 32,18 18,34 4,18', fill: 'none', strokeLinejoin: 'round',
            style: { stroke: 'var(--ring-edge)', strokeWidth: 4.6 } }),
          h('polygon', { points: '18,2 32,18 18,34 4,18', fill: 'none', strokeLinejoin: 'round',
            style: { stroke: 'var(--ring)', strokeWidth: 2.4 } })
        )
      );
    }

    /* Original outlined cat, side view, walking on the spot */
    function Cat() {
      const leg = (x, delay, opacity) => h('rect', {
        className: 'leg', x: x, y: 38, width: 7, height: 21, rx: 3.5,
        opacity: opacity,
        style: { transformOrigin: (x + 3.5) + 'px 40px', animationDelay: delay }
      });
      const bg = { fill: 'var(--bg)' };
      const solid = { fill: 'currentColor' };

      return h('div', { className: 'cat', 'aria-hidden': 'true' },
        h('svg', {
          viewBox: '0 0 100 64', width: 64, height: 41,
          stroke: 'currentColor', strokeWidth: 1.8, strokeLinejoin: 'round', strokeLinecap: 'round',
          style: { fill: 'none' }
        },
          // far-side legs (dimmer, for depth), then near-side legs
          leg(31, '-0.35s', 0.55), leg(67, '0s', 0.55),
          leg(39, '0s', 1), leg(75, '-0.35s', 1),
          // tail: outlined tube (dark stroke, then background-coloured core)
          h('g', { className: 'tail', style: { transformOrigin: '80px 33px' } },
            h('path', { d: 'M80 33 C93 33, 96 18, 89 9', strokeWidth: 7.5, style: { fill: 'none' } }),
            h('path', { d: 'M80 33 C93 33, 96 18, 89 9', strokeWidth: 4, style: { fill: 'none', stroke: 'var(--bg)' } })
          ),
          h('g', { className: 'cat-body' },
            h('ellipse', { cx: 57, cy: 33, rx: 27, ry: 12, style: bg }),
            h('path', { d: 'M46 22.5 L48.5 29 M54 21.5 L56.5 28.5 M62 21.5 L64 28', strokeWidth: 1.5, opacity: 0.7, style: { fill: 'none' } }),
            // ears sit behind the head
            h('polygon', { points: '12,21 13,5 25,14', style: bg }),
            h('polygon', { points: '22,13 33,5 36,21', style: bg }),
            h('path', { d: 'M15.5 15 L16 10 L21 13.5', strokeWidth: 1.2, opacity: 0.7, style: { fill: 'none' } }),
            h('ellipse', { cx: 24, cy: 27, rx: 14, ry: 12, style: bg }),
            h('ellipse', { className: 'eye', cx: 18, cy: 25, rx: 2.2, ry: 2.8, strokeWidth: 0.5,
              style: Object.assign({ transformOrigin: '18px 25px' }, solid) }),
            h('polygon', { points: '9.5,29 13.5,29 11.5,31.6', strokeWidth: 0.8, style: solid }),
            h('path', { d: 'M11.5 31.6 Q11.5 34.5 8.5 34.5 M11.5 31.6 Q11.5 34.5 14.5 34.5', strokeWidth: 1.1, style: { fill: 'none' } }),
            h('path', { d: 'M11 29 L1 26.5 M11 31 L1 33.5', strokeWidth: 1, opacity: 0.75, style: { fill: 'none' } })
          )
        )
      );
    }

    function Page() {
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const mouseRef = useRef({ x: -9999, y: -9999 });

      /* ---------- Theme ---------- */
      const [theme, setTheme] = useState(getInitialTheme);
      const paletteRef = useRef(PALETTES[theme]);

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        paletteRef.current = PALETTES[theme];
        try { localStorage.setItem('theme', theme); } catch (e) { /* ignore */ }
      }, [theme]);

      const toggleTheme = () => setTheme((t) => (t === 'dark' ? 'light' : 'dark'));

      /* ---------- Typewriter ---------- */
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const [count, setCount] = useState(reduceMotion ? NAME.length : 0);
      const [caretOn, setCaretOn] = useState(true);

      useEffect(() => {
        if (reduceMotion) { setCaretOn(false); return; }
        let interval;
        const start = setTimeout(() => {
          interval = setInterval(() => {
            setCount((c) => {
              if (c >= NAME.length) { clearInterval(interval); return c; }
              return c + 1;
            });
          }, TYPE_SPEED);
        }, TYPE_DELAY);
        return () => { clearTimeout(start); clearInterval(interval); };
      }, []);

      // hide the caret shortly after typing finishes
      useEffect(() => {
        if (count < NAME.length) return;
        const t = setTimeout(() => setCaretOn(false), 2200);
        return () => clearTimeout(t);
      }, [count]);

      /* ---------- Particle network ---------- */
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let w, h, dpr;
        const LINK_DIST = 130;
        const wavesRef = { current: [] };

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.clientWidth; h = canvas.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function makeParticles(n) {
          const arr = [];
          for (let i = 0; i < n; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 8 + Math.random() * 14; // px/sec, constant — no decay
            arr.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 1.3 + Math.random() * 1.6,
              glow: 0
            });
          }
          return arr;
        }
        particlesRef.current = makeParticles(Math.floor((w * h) / 9000));

        function onMove(e) {
          const rect = canvas.getBoundingClientRect();
          mouseRef.current.x = e.clientX - rect.left;
          mouseRef.current.y = e.clientY - rect.top;
        }
        function onLeave() { mouseRef.current.x = -9999; mouseRef.current.y = -9999; }
        function fireWave(cx, cy) {
          wavesRef.current.push({ x: cx, y: cy, born: performance.now() });
        }
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseleave', onLeave);
        const clickHandler = (e) => onClick(e);
        canvas.addEventListener('click', clickHandler);
        canvas.addEventListener('touchstart', (e) => {
          const t = e.touches[0]; const rect = canvas.getBoundingClientRect();
          fireWave(t.clientX - rect.left, t.clientY - rect.top);
        }, { passive: true });

        const WAVE_SPEED = 900;   // px per second
        const WAVE_BAND = 46;     // thickness of the lit band
        const WAVE_LIFE = 1300;   // ms until a wave fully fades
        const MAX_PARTICLES = 180;

        function onClick(e) {
          const rect = canvas.getBoundingClientRect();
          const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
          fireWave(cx, cy);
          // spawn a new node at the click point so it joins the network
          const arr = particlesRef.current;
          const n = 2 + Math.floor(Math.random() * 2);
          for (let i = 0; i < n; i++) {
            if (arr.length >= MAX_PARTICLES) arr.shift();
            const ang = Math.random() * Math.PI * 2;
            const spd = 8 + Math.random() * 14;
            arr.push({
              x: cx + (Math.random() - 0.5) * 20,
              y: cy + (Math.random() - 0.5) * 20,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 1.6 + Math.random() * 1.6,
              glow: 1
            });
          }
        }

        // occasional comets that streak across the background, left -> right
        const comets = [];
        let nextComet = performance.now() + 2500;
        function spawnComet() {
          const speed = 520 + Math.random() * 260;
          const ang = 0.08 + Math.random() * 0.35; // gentle downward slope
          comets.push({
            x: -40, y: Math.random() * h * 0.55,
            vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
            trail: [], done: false
          });
        }

        let raf, last = performance.now();
        function tick(now) {
          const pal = paletteRef.current; // always current theme
          const dt = Math.min(now - last, 40); last = now;
          const dtSec = dt / 1000;
          ctx.clearRect(0, 0, w, h);
          const arr = particlesRef.current;
          const m = mouseRef.current;
          const waves = wavesRef.current;

          // advance ambient particles at constant drift speed
          for (const p of arr) {
            const dx = p.x - m.x, dy = p.y - m.y;
            const d = Math.hypot(dx, dy);
            if (d < 90 && d > 0.01) {
              const f = (90 - d) / 90 * 30;
              p.vx += (dx / d) * f * dtSec;
              p.vy += (dy / d) * f * dtSec;
            }
            p.x += p.vx * dtSec; p.y += p.vy * dtSec;
            if (p.x < -5) p.x = w + 5; if (p.x > w + 5) p.x = -5;
            if (p.y < -5) p.y = h + 5; if (p.y > h + 5) p.y = -5;
            p.glow *= 0.92;
          }

          // expire old waves
          for (let i = waves.length - 1; i >= 0; i--) {
            if (now - waves[i].born > WAVE_LIFE) waves.splice(i, 1);
          }

          // draw connecting threads, illuminating any a wave-front is currently crossing
          ctx.lineWidth = 1;
          for (let i = 0; i < arr.length; i++) {
            for (let j = i + 1; j < arr.length; j++) {
              const a = arr[i], b = arr[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const dist = Math.hypot(dx, dy);
              if (dist >= LINK_DIST) continue;
              const baseAlpha = 1 - dist / LINK_DIST;

              let lit = 0;
              for (const wv of waves) {
                const age = now - wv.born;
                const radius = age / 1000 * WAVE_SPEED;
                const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
                const dMid = Math.hypot(mx - wv.x, my - wv.y);
                const delta = Math.abs(dMid - radius);
                if (delta < WAVE_BAND / 2) {
                  const strength = (1 - delta / (WAVE_BAND / 2)) * (1 - age / WAVE_LIFE);
                  if (strength > lit) lit = strength;
                  a.glow = Math.max(a.glow, strength);
                  b.glow = Math.max(b.glow, strength);
                }
              }

              if (lit > 0.02) {
                ctx.strokeStyle = pal.lit(Math.min(lit, 1));
                ctx.lineWidth = 1.4;
              } else {
                ctx.strokeStyle = pal.line(baseAlpha);
                ctx.lineWidth = 1;
              }
              ctx.beginPath();
              ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }

          // comets: update, draw tail + head, and lightly ignite nodes they pass
          if (!reduceMotion && now >= nextComet) {
            spawnComet();
            nextComet = now + 7000 + Math.random() * 8000;
          }
          ctx.lineCap = 'round';
          for (let i = comets.length - 1; i >= 0; i--) {
            const c = comets[i];
            if (!c.done) {
              c.x += c.vx * dtSec; c.y += c.vy * dtSec;
              c.trail.push({ x: c.x, y: c.y });
              if (c.trail.length > 38) c.trail.shift();
              if (c.x > w + 60 || c.y > h + 60) c.done = true;
            } else {
              c.trail.shift();
              if (c.trail.length === 0) { comets.splice(i, 1); continue; }
            }
            const tr = c.trail;
            for (let k = 1; k < tr.length; k++) {
              const t = k / tr.length;
              ctx.strokeStyle = pal.cometTail(t * 0.85);
              ctx.lineWidth = 0.6 + t * 2.8;
              ctx.beginPath();
              ctx.moveTo(tr[k - 1].x, tr[k - 1].y);
              ctx.lineTo(tr[k].x, tr[k].y);
              ctx.stroke();
            }
            if (!c.done) {
              ctx.beginPath(); ctx.fillStyle = pal.cometGlow;
              ctx.arc(c.x, c.y, 9, 0, Math.PI * 2); ctx.fill();
              ctx.beginPath(); ctx.fillStyle = pal.cometHead;
              ctx.arc(c.x, c.y, 2.6, 0, Math.PI * 2); ctx.fill();
              for (const p of arr) {
                if (Math.hypot(p.x - c.x, p.y - c.y) < 50) p.glow = Math.max(p.glow, 0.7);
              }
            }
          }
          ctx.lineCap = 'butt';

          for (const p of arr) {
            const glow = Math.min(p.glow, 1);
            if (glow > 0.03) {
              ctx.beginPath();
              ctx.fillStyle = pal.halo(glow);
              ctx.arc(p.x, p.y, p.r + glow * 4.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.beginPath();
            ctx.fillStyle = glow > 0.03 ? pal.core(glow) : pal.particle;
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }

          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);
