<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudarshan Sawandkar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" href="assets/face.jpg" />
  <style>
    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #71717a;
      --line: #27272a;
      --accent: #818cf8;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
    }

    body {
      font-family: "Montserrat", sans-serif;
      font-optical-sizing: auto;
      font-weight: normal;
      font-style: normal;
      color: var(--fg);
      overflow: hidden;
    }

    #root {
      position: relative;
      height: 100%;
      width: 100%;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .eyebrow {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 14px;
      letter-spacing: .02em;
    }

    h1 {
      font-size: clamp(32px, 6vw, 52px);
      margin: 0 0 16px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    p.bio {
      max-width: 520px;
      color: #d4d4d8;
      line-height: 1.6;
      font-size: 16px;
      margin: 0 0 28px;
    }

    .links {
      display: flex;
      gap: 18px;
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    .links a {
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      transition: color .15s, border-color .15s, transform .15s;
    }

    .links a:hover {
      color: #bfe0ff;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .foot {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    @media (max-width:480px) {
      .foot {
        flex-direction: column;
        gap: 4px;
        align-items: center;
        text-align: center;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    const { useEffect, useRef, createElement: h } = React;

    function Page() {
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const mouseRef = useRef({ x: -9999, y: -9999 });

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let w, h, dpr;
        const LINK_DIST = 130;
        const wavesRef = { current: [] };

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          w = canvas.clientWidth; h = canvas.clientHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function makeParticles(n) {
          const arr = [];
          for (let i = 0; i < n; i++) {
            const ang = Math.random() * Math.PI * 2;
            const spd = 8 + Math.random() * 14; // px/sec, constant — no decay
            arr.push({
              x: Math.random() * w,
              y: Math.random() * h,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 1.3 + Math.random() * 1.6,
              glow: 0
            });
          }
          return arr;
        }
        particlesRef.current = makeParticles(Math.floor((w * h) / 9000));

        function onMove(e) {
          const rect = canvas.getBoundingClientRect();
          mouseRef.current.x = e.clientX - rect.left;
          mouseRef.current.y = e.clientY - rect.top;
        }
        function onLeave() { mouseRef.current.x = -9999; mouseRef.current.y = -9999; }
        function fireWave(cx, cy) {
          wavesRef.current.push({ x: cx, y: cy, born: performance.now() });
        }
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseleave', onLeave);
        const clickHandler = (e) => onClick(e);
        canvas.addEventListener('click', clickHandler);
        canvas.addEventListener('touchstart', (e) => {
          const t = e.touches[0]; const rect = canvas.getBoundingClientRect();
          fireWave(t.clientX - rect.left, t.clientY - rect.top);
        }, { passive: true });

        const WAVE_SPEED = 900;   // px per second — faster wave
        const WAVE_BAND = 46;     // thickness of the lit band
        const WAVE_LIFE = 1300;   // ms until a wave fully fades
        const MAX_PARTICLES = 180;

        function onClick(e) {
          const rect = canvas.getBoundingClientRect();
          const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
          fireWave(cx, cy);
          // spawn a new node at the click point so it joins the network
          const arr = particlesRef.current;
          const n = 2 + Math.floor(Math.random() * 2);
          for (let i = 0; i < n; i++) {
            if (arr.length >= MAX_PARTICLES) arr.shift();
            const ang = Math.random() * Math.PI * 2;
            const spd = 8 + Math.random() * 14;
            arr.push({
              x: cx + (Math.random() - 0.5) * 20,
              y: cy + (Math.random() - 0.5) * 20,
              vx: Math.cos(ang) * spd,
              vy: Math.sin(ang) * spd,
              r: 1.6 + Math.random() * 1.6,
              glow: 1
            });
          }
        }

        let raf, last = performance.now();
        function tick(now) {
          const dt = Math.min(now - last, 40); last = now;
          const dtSec = dt / 1000;
          ctx.clearRect(0, 0, w, h);
          const arr = particlesRef.current;
          const m = mouseRef.current;
          const waves = wavesRef.current;

          // advance ambient particles at constant drift speed
          for (const p of arr) {
            const dx = p.x - m.x, dy = p.y - m.y;
            const d = Math.hypot(dx, dy);
            if (d < 90 && d > 0.01) {
              const f = (90 - d) / 90 * 30;
              p.vx += (dx / d) * f * dtSec;
              p.vy += (dy / d) * f * dtSec;
            }
            p.x += p.vx * dtSec; p.y += p.vy * dtSec;
            if (p.x < -5) p.x = w + 5; if (p.x > w + 5) p.x = -5;
            if (p.y < -5) p.y = h + 5; if (p.y > h + 5) p.y = -5;
            p.glow *= 0.92;
          }

          // expire old waves
          for (let i = waves.length - 1; i >= 0; i--) {
            if (now - waves[i].born > WAVE_LIFE) waves.splice(i, 1);
          }

          // draw connecting threads, illuminating any a wave-front is currently crossing
          ctx.lineWidth = 1;
          for (let i = 0; i < arr.length; i++) {
            for (let j = i + 1; j < arr.length; j++) {
              const a = arr[i], b = arr[j];
              const dx = a.x - b.x, dy = a.y - b.y;
              const dist = Math.hypot(dx, dy);
              if (dist >= LINK_DIST) continue;
              const baseAlpha = 1 - dist / LINK_DIST;

              let lit = 0;
              for (const wv of waves) {
                const age = now - wv.born;
                const radius = age / 1000 * WAVE_SPEED;
                const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
                const dMid = Math.hypot(mx - wv.x, my - wv.y);
                const delta = Math.abs(dMid - radius);
                if (delta < WAVE_BAND / 2) {
                  const strength = (1 - delta / (WAVE_BAND / 2)) * (1 - age / WAVE_LIFE);
                  if (strength > lit) lit = strength;
                  a.glow = Math.max(a.glow, strength);
                  b.glow = Math.max(b.glow, strength);
                }
              }

              if (lit > 0.02) {
                const s = Math.min(lit, 1);
                ctx.strokeStyle = `rgba(${210 - 40 * s},${232 - 10 * s},255,${s})`;
                ctx.lineWidth = 1.4;
              } else {
                ctx.strokeStyle = `rgba(161,161,170,${baseAlpha * 0.28})`;
                ctx.lineWidth = 1;
              }
              ctx.beginPath();
              ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }

          for (const p of arr) {
            const glow = Math.min(p.glow, 1);
            if (glow > 0.03) {
              ctx.beginPath();
              ctx.fillStyle = `rgba(150,205,255,${glow * 0.4})`;
              ctx.arc(p.x, p.y, p.r + glow * 4.5, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.beginPath();
            ctx.fillStyle = glow > 0.03
              ? `rgba(255,255,255,${0.85 + glow * 0.15})`
              : 'rgba(212,212,216,0.85)';
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }

          raf = requestAnimationFrame(tick);
        }
        raf = requestAnimationFrame(tick);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', resize);
          canvas.removeEventListener('mousemove', onMove);
          canvas.removeEventListener('mouseleave', onLeave);
          canvas.removeEventListener('click', clickHandler);
        };
      }, []);

      const icons = {
        LinkedIn: h('svg', { viewBox: '0 0 24 24', width: 50, height: 50, fill: 'none', shapeRendering: 'geometricPrecision' },
          h('rect', { x: 2.2, y: 2.2, width: 19.6, height: 19.6, rx: 5, stroke: 'currentColor', strokeWidth: 2 }),
          h('circle', { cx: 7.5, cy: 7.8, r: 1.5, fill: 'currentColor' }),
          h('path', { d: 'M7.5 11v6M11.2 17v-3.4c0-1.5.9-2.6 2.3-2.6s2 1 2 2.5V17M11.2 11v6', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' })
        ),
        Gmail: h('svg', { viewBox: '0 0 24 24', width: 24, height: 24, fill: 'none', shapeRendering: 'geometricPrecision' },
          h('circle', { cx: 12, cy: 12, r: 9, stroke: 'currentColor', strokeWidth: 2 }),
          h('rect', { x: 6, y: 8.5, width: 12, height: 7.5, rx: 1.4, stroke: 'currentColor', strokeWidth: 2, strokeLinejoin: 'round' }),
          h('path', { d: 'M6.6 9.2l5.4 4 5.4-4', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' })
        ),
      };

      return h(React.Fragment, null,
        h('canvas', { ref: canvasRef }),
        h('div', { className: 'content' },
          // h('p', {className:'eyebrow'}, 'sudarshansb143@gmail.com'),
          h('h1', null, 'Sudarshan Sawandkar'),
          h('i', { className: 'bio' },
            "Software Engineer "
          ),
          h('br'),
          h('p', { className: 'bio' },
            "Building web apps and managing high throughput systems. Currently focused on AI and Performance Engineering"
          ),
          h('div', { className: 'links' },
            Object.keys(icons).map(name => {
              if (name === "Gmail") {
                return h('a', { key: name, href: 'mailto:sudarshansb143@gmail.com', target: '_blank', rel: 'noopener', 'aria-label': name, title: name }, icons[name])
              } else {
                return h('a', { key: name, href: 'https://www.linkedin.com/in/sudarshan-78jack/', target: '_blank', rel: 'noopener', 'aria-label': name, title: name }, icons[name])
              }
            }
            )
          )
        ),
        h('div', { className: 'foot' },
          // h('span', null, 'tmyourhandle'),
          h('span', null, '\u00A9 2026 Sudarshan Sawandkar')
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
  </script>
</body>

</html>
